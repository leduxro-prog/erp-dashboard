# ==============================================================================
# Cypher ERP - Main Docker Compose Configuration
# ==============================================================================
#
# This is the main Docker Compose configuration for the Cypher ERP system.
# For production deployment, use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# For development, use this file directly: docker compose up -d
#
# Environment Variables:
#   See .env.example for a complete list of required and optional variables
#
# ==============================================================================

services:
  # ==============================================================================
  # Frontend (Nginx + React/Vite)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend-net
      - cypher-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - 'com.cypher.service=frontend'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'
        - 'com.cypher.version=${VERSION:-0.1.0}'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        labels: 'service,environment'

  # ==============================================================================
  # CYPHER ERP Application (Backend API)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
    restart: always
    expose:
      - '3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOYMENT_INTENT: ${DEPLOYMENT_INTENT:-local}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      APP_NAME: ${APP_NAME:-CYPHER ERP}
      APP_URL: ${APP_URL:-https://erp.ledux.ro}
      FRONTEND_URL: ${FRONTEND_URL:-https://erp.ledux.ro}
      B2B_FRONTEND_URL: ${B2B_FRONTEND_URL:-https://b2b.ledux.ro}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://erp.ledux.ro}
      CANONICAL_SHOP_URL: ${CANONICAL_SHOP_URL:-}
      LEGACY_STOREFRONT_URL: ${LEGACY_STOREFRONT_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.ledux.ro}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      VERSION: ${VERSION:-0.1.0}

      # Database Configuration
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cypher_erp}
      DB_USER: ${DB_USER:-${DB_USERNAME:-cypher_user}}
      DB_USERNAME: ${DB_USERNAME:-${DB_USER:-cypher_user}}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Per-instance pool limits. Keep conservative when scaling app replicas.
      DB_POOL_MIN: ${DB_POOL_MIN:-3}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-120000}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-120000}
      SUPPLIER_MONITOR_TARGET_CODE: ${SUPPLIER_MONITOR_TARGET_CODE:-aca-lighting}
      SUPPLIER_MONITOR_MIN_PRODUCTS: ${SUPPLIER_MONITOR_MIN_PRODUCTS:-1000}
      SUPPLIER_MONITOR_FAILURE_WINDOW: ${SUPPLIER_MONITOR_FAILURE_WINDOW:-8}
      SUPPLIER_MONITOR_CONSECUTIVE_FAILURES: ${SUPPLIER_MONITOR_CONSECUTIVE_FAILURES:-3}
      SUPPLIER_MONITOR_TIMEOUT_FAILURES: ${SUPPLIER_MONITOR_TIMEOUT_FAILURES:-2}
      SUPPLIER_MONITOR_ALERT_COOLDOWN_MS: ${SUPPLIER_MONITOR_ALERT_COOLDOWN_MS:-1800000}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_SECRET_FILE: ${JWT_REFRESH_SECRET_FILE:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_SECRET_B2B: ${JWT_SECRET_B2B:?JWT_SECRET_B2B is required}
      JWT_SECRET_B2B_FILE: ${JWT_SECRET_B2B_FILE:-}
      JWT_REFRESH_SECRET_B2B: ${JWT_REFRESH_SECRET_B2B:?JWT_REFRESH_SECRET_B2B is required}
      JWT_REFRESH_SECRET_B2B_FILE: ${JWT_REFRESH_SECRET_B2B_FILE:-}

      # SmartBill API
      SMARTBILL_API_URL: ${SMARTBILL_API_URL:-https://ws.smartbill.ro/SMBWS/api}
      SMARTBILL_USERNAME: ${SMARTBILL_USERNAME:-}
      SMARTBILL_TOKEN: ${SMARTBILL_TOKEN:-}
      SMARTBILL_COMPANY_VAT: ${SMARTBILL_COMPANY_VAT:-}
      SMARTBILL_INVOICE_SERIES: ${SMARTBILL_INVOICE_SERIES:-FL}
      SMARTBILL_SYNC_INTERVAL_MS: ${SMARTBILL_SYNC_INTERVAL_MS:-900000}

      # WooCommerce API
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:-https://ledux.ro}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-wc/v3}
      WOOCOMMERCE_API_KEY: ${WOOCOMMERCE_API_KEY:-}
      WOOCOMMERCE_API_SECRET: ${WOOCOMMERCE_API_SECRET:-}

      # WhatsApp Business (Agent B)
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}

      # Evolution API (WhatsApp sessions)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      EVOLUTION_INSTANCE_SALES: ${EVOLUTION_INSTANCE_SALES:-wa-sales}
      EVOLUTION_INSTANCE_SUPPORT: ${EVOLUTION_INSTANCE_SUPPORT:-wa-support}
      EVOLUTION_NUMBER_SALES: ${EVOLUTION_NUMBER_SALES:-}
      EVOLUTION_NUMBER_SUPPORT: ${EVOLUTION_NUMBER_SUPPORT:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_FILE: ${GEMINI_API_KEY_FILE:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-https://erp.ledux.ro}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Cypher ERP WhatsApp Bot}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-15000}
      BOT_METRICS_LOG_EVERY: ${BOT_METRICS_LOG_EVERY:-20}
      BOT_CONTEXT_MESSAGES: ${BOT_CONTEXT_MESSAGES:-20}
      BOT_KNOWLEDGE_FILE: ${BOT_KNOWLEDGE_FILE:-/app/config/bot_knowledge.json}
      BOT_MARKET_SIGNALS_FILE: ${BOT_MARKET_SIGNALS_FILE:-/app/config/market_signals.json}
      BOT_MARKET_SIGNALS_CRON: ${BOT_MARKET_SIGNALS_CRON:-15 2 * * *}
      BOT_KNOWLEDGE_SYNC_HOURS: ${BOT_KNOWLEDGE_SYNC_HOURS:-24}
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      GSC_SERVICE_ACCOUNT_JSON: ${GSC_SERVICE_ACCOUNT_JSON:-}
      MARKETING_GSC_SYNC_CRON: ${MARKETING_GSC_SYNC_CRON:-25 2 * * *}
      MARKETING_WP_AUTO_PUBLISH_ENABLED: ${MARKETING_WP_AUTO_PUBLISH_ENABLED:-true}
      MARKETING_WP_AUTO_PUBLISH_CRON: ${MARKETING_WP_AUTO_PUBLISH_CRON:-55 2 * * *}
      MARKETING_WP_AUTO_PUBLISH_DAILY_LIMIT: ${MARKETING_WP_AUTO_PUBLISH_DAILY_LIMIT:-2}
      MARKETING_WP_AUTO_PUBLISH_MIN_SCORE: ${MARKETING_WP_AUTO_PUBLISH_MIN_SCORE:-35}
      MARKETING_WP_AUTO_PUBLISH_PER_CATEGORY_LIMIT: ${MARKETING_WP_AUTO_PUBLISH_PER_CATEGORY_LIMIT:-1}
      WP_SITE_URL: ${WP_SITE_URL:-https://ledux.ro}
      WP_APP_USER: ${WP_APP_USER:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
      WP_APP_PASSWORD_FILE: ${WP_APP_PASSWORD_FILE:-}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_PASSWORD_FILE: ${WP_ADMIN_PASSWORD_FILE:-}
      FEATURE_ENABLE_WHATSAPP_MODULE: ${FEATURE_ENABLE_WHATSAPP_MODULE:-true}

      # Email Configuration
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ledux.ro}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Ledux.ro}

      # Supplier Configuration
      SUPPLIER_SYNC_INTERVAL_MS: ${SUPPLIER_SYNC_INTERVAL_MS:-14400000}
      SUPPLIER_SCRAPE_TIMEOUT_MS: ${SUPPLIER_SCRAPE_TIMEOUT_MS:-30000}
      SUPPLIER_SCRAPE_MAX_RETRIES: ${SUPPLIER_SCRAPE_MAX_RETRIES:-3}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Feature Flags
      FEATURE_ADVANCED_REPORTING: ${FEATURE_ADVANCED_REPORTING:-true}
      FEATURE_AI_RECOMMENDATIONS: ${FEATURE_AI_RECOMMENDATIONS:-true}
      FEATURE_MULTI_CURRENCY: ${FEATURE_MULTI_CURRENCY:-true}
      FEATURE_FLAG_ENABLE_B2B_PORTAL: ${FEATURE_FLAG_ENABLE_B2B_PORTAL:-true}
      FEATURE_ENABLE_WOOCOMMERCE_SYNC: ${FEATURE_ENABLE_WOOCOMMERCE_SYNC:-true}
      FEATURE_WOOCOMMERCE_SYNC: ${FEATURE_WOOCOMMERCE_SYNC:-true}
      FEATURE_FLAG_WOOCOMMERCE_SYNC: ${FEATURE_FLAG_WOOCOMMERCE_SYNC:-true}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:-}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-3600000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ledux.ro,https://www.ledux.ro,https://erp.ledux.ro,https://b2b.ledux.ro,https://api.ledux.ro}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      ALLOW_LOCALHOST_ORIGINS: ${ALLOW_LOCALHOST_ORIGINS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-2}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - frontend-net
      - backend-net
      - cypher-network

    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./uploads:/app/uploads

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - 'com.cypher.service=app'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'
        - 'com.cypher.version=${VERSION:-0.1.0}'

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service,environment,version'

  # ==============================================================================
  # PostgreSQL Database
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: cypher-erp-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: ${DB_NAME:-cypher_erp}
      POSTGRES_USER: ${DB_USER:-${DB_USERNAME:-cypher_user}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}

    command:
      - 'postgres'
      - '-c'
      - 'max_connections=200'
      - '-c'
      - 'shared_buffers=512MB'
      - '-c'
      - 'effective_cache_size=2GB'
      - '-c'
      - 'maintenance_work_mem=128MB'
      - '-c'
      - 'checkpoint_completion_target=0.9'
      - '-c'
      - 'wal_buffers=16MB'
      - '-c'
      - 'default_statistics_target=100'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'effective_io_concurrency=200'
      - '-c'
      - 'work_mem=2621kB'
      - '-c'
      - 'min_wal_size=1GB'
      - '-c'
      - 'max_wal_size=4GB'

    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro

    networks:
      - backend-net

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-${DB_USERNAME:-cypher_user}} -d ${DB_NAME:-cypher_erp}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - 'com.cypher.service=db'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service,environment'

  # ==============================================================================
  # Redis Cache
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: cypher-erp-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: >
      sh -c 'redis-server --requirepass $${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction'

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    volumes:
      - redis-data:/data

    networks:
      - backend-net

    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      labels:
        - 'com.cypher.service=redis'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        labels: 'service,environment'

  # ==============================================================================
  # MeiliSearch - High Performance Search Engine
  # ==============================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: cypher-erp-search
    restart: unless-stopped
    ports:
      - '127.0.0.1:7700:7700'

    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: ${NODE_ENV:-development}

    volumes:
      - meili-data:/meili_data

    networks:
      - backend-net

    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - 'com.cypher.service=meilisearch'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        labels: 'service,environment'

  # ==============================================================================
  # PgAdmin - Database Management UI (Optional)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: cypher-erp-pgadmin
    restart: unless-stopped
    ports:
      - '127.0.0.1:5050:80'

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ledux.ro}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    networks:
      - backend-net

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80/misc/ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      labels:
        - 'com.cypher.service=pgadmin'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        labels: 'service,environment'

  # ==============================================================================
  # AI Agents Service (Python)
  # ==============================================================================
  ai-service:
    build:
      context: ./modules/ai-agents
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8001:8000'

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHATBOT_CONTEXT_MESSAGES: ${BOT_CONTEXT_MESSAGES:-20}
      DATABASE_URL: postgresql://${DB_USER:-${DB_USERNAME:-cypher_user}}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-cypher_erp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend-net

    volumes:
      - ./modules/ai-agents:/app

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - 'com.cypher.service=ai-service'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service,environment'

  # ==============================================================================
  # Ollama - Local LLM Fallback (low resource profile)
  # ==============================================================================
  ollama:
    image: ollama/ollama:0.6.2
    container_name: cypher-erp-ollama
    restart: unless-stopped
    ports:
      - '127.0.0.1:11435:11434'

    networks:
      - backend-net

    dns:
      - 1.1.1.1
      - 8.8.8.8

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
        reservations:
          cpus: '0.5'
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      labels:
        - 'com.cypher.service=ollama'
        - 'com.cypher.environment=${NODE_ENV:-production}'

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service,environment'

  # ==============================================================================
  # RabbitMQ - Event Bus
  # ==============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cypher-rabbitmq
    hostname: rabbitmq

    ports:
      # AMQP protocol port
      - '127.0.0.1:5672:5672'
      # Management UI port
      - '127.0.0.1:15672:15672'
      # Prometheus metrics port (optional)
      - '127.0.0.1:15692:15692'

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}

      # Memory and disk thresholds
      RABBITMQ_DISK_FREE_LIMIT: 1GB

      # Enable plugins
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit log_levels [{connection,error},{default,warning}]'

    volumes:
      # Persist data across container restarts
      - rabbitmq-data:/var/lib/rabbitmq
      # Persist configuration
      - rabbitmq-config:/etc/rabbitmq

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - backend-net

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      labels:
        - 'com.cypher.service=rabbitmq'
        - 'com.cypher.environment=${DEPLOYMENT_INTENT:-local}'

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
        labels: 'service,environment'

# ==============================================================================
# Networks
# ==============================================================================
networks:
  cypher-network:
    name: ${COMPOSE_PROJECT_NAME:-cypher-erp}_cypher-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    labels:
      - 'com.cypher.network=default'
  frontend-net:
    driver: bridge
    labels:
      - 'com.cypher.network=frontend'
  backend-net:
    driver: bridge
    labels:
      - 'com.cypher.network=backend'
  monitoring-net:
    driver: bridge
    labels:
      - 'com.cypher.network=monitoring'

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  db-data:
    name: cypher-db-data
    driver: local

  redis-data:
    name: cypher-redis-data
    driver: local

  meili-data:
    name: cypher-meili-data
    driver: local

  pgadmin-data:
    name: cypher-pgadmin-data
    driver: local

  rabbitmq-data:
    name: cypher-rabbitmq-data
    driver: local

  rabbitmq-config:
    name: cypher-rabbitmq-config
    driver: local

  ollama-data:
    name: cypher-ollama-data
    driver: local
