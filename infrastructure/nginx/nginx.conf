# ============================================================
# NOTE: This nginx config is NOT used in the Docker deployment.
# The active nginx config is at: frontend/nginx.conf
# This file is kept as reference for standalone/bare-metal deployments.
# ============================================================

upstream cypher_api {
    server api:3000;
}

map $host $shell_title {
    default "Ledux ERP";
    b2b.ledux.ro "Ledux B2B";
}

map $host $shell_site_name {
    default "Ledux ERP";
    b2b.ledux.ro "Ledux B2B";
}

map $host $shell_description {
    default "Ledux ERP pentru operatiuni interne, vanzari, inventar, comenzi si administrare B2B.";
    b2b.ledux.ro "Portalul B2B Ledux pentru catalog profesional, comenzi corporate si acces parteneri.";
}

map $host $shell_theme_color {
    default "#111827";
    b2b.ledux.ro "#b8860b";
}

map $host $shell_favicon {
    default /erp/favicon.svg;
    b2b.ledux.ro /b2b/favicon.svg;
}

map $host $shell_apple_touch_icon {
    default /erp/apple-touch-icon.png;
    b2b.ledux.ro /b2b/apple-touch-icon.png;
}

map $host $shell_manifest {
    default /erp/manifest.webmanifest;
    b2b.ledux.ro /b2b/manifest.webmanifest;
}

map $host $shell_canonical {
    default https://erp.ledux.ro/;
    b2b.ledux.ro https://b2b.ledux.ro/;
}

server {
    listen 80;
    server_name api.ledux.ro;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ledux.ro;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.ledux.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ledux.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;

    root /var/www/html;
    index index.html;

    # Request size limits
    client_max_body_size 10M;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # API proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://cypher_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://cypher_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /erp/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /b2b/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Vary "Host" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__LEDUX_TITLE__' '$shell_title';
        sub_filter '__LEDUX_SITE_NAME__' '$shell_site_name';
        sub_filter '__LEDUX_APPLICATION_NAME__' '$shell_site_name';
        sub_filter '__LEDUX_DESCRIPTION__' '$shell_description';
        sub_filter '__LEDUX_THEME_COLOR__' '$shell_theme_color';
        sub_filter '__LEDUX_FAVICON__' '$shell_favicon';
        sub_filter '__LEDUX_APPLE_TOUCH_ICON__' '$shell_apple_touch_icon';
        sub_filter '__LEDUX_MANIFEST__' '$shell_manifest';
        sub_filter '__LEDUX_CANONICAL__' '$shell_canonical';
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
