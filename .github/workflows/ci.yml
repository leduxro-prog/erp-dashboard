name: CI Pipeline

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Linting job
  lint:
    runs-on: ubuntu-latest
    name: Lint Code
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Fetch base commit for PR lint diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Run ESLint (PR changed files)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_TS=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^(src|shared|modules)/.*\.ts$' || true)
          if [ -z "$CHANGED_TS" ]; then
            echo "No backend TypeScript files changed. Skipping backend ESLint."
            exit 0
          fi
          echo "Running backend ESLint on changed files:"
          echo "$CHANGED_TS"
          echo "$CHANGED_TS" | xargs npx eslint

      - name: Run ESLint (push full)
        if: github.event_name != 'pull_request'
        run: npm run lint
        continue-on-error: false

      - name: Run frontend ESLint (PR changed files)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FE=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^frontend/src/.*\.(ts|tsx)$' || true)
          if [ -z "$CHANGED_FE" ]; then
            echo "No frontend TS/TSX files changed. Skipping frontend ESLint."
            exit 0
          fi
          echo "Running frontend ESLint on changed files:"
          echo "$CHANGED_FE"
          echo "$CHANGED_FE" | xargs npm --prefix frontend exec eslint

      - name: Run frontend ESLint (push full)
        if: github.event_name != 'pull_request'
        run: npm --prefix frontend run lint
        continue-on-error: false

      - name: Check Prettier (PR changed files)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FMT=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^(src|shared|modules)/.*\.ts$' || true)
          if [ -z "$CHANGED_FMT" ]; then
            echo "No backend TypeScript files changed. Skipping Prettier check."
            exit 0
          fi
          echo "$CHANGED_FMT" | xargs npx prettier --check

      - name: Check code formatting with Prettier (push full)
        if: github.event_name != 'pull_request'
        run: npx prettier --check 'src/**/*.ts' 'shared/**/*.ts' 'modules/**/*.ts'
        continue-on-error: false

  # Testing job
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cypher_erp_test
          POSTGRES_USER: cypher_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run changed-module tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cypher_erp_test
          DB_USER: cypher_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run tests with coverage (push)
        if: github.event_name != 'pull_request'
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cypher_erp_test
          DB_USER: cypher_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 30

  # Build job
  build:
    runs-on: ubuntu-latest
    name: Build Application
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build TypeScript incrementally (PR)
        if: github.event_name == 'pull_request'
        run: npm run build:incremental

      - name: Build TypeScript (push)
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not created"
            exit 1
          fi
          echo "Build successful. Files created:"
          find dist -type f -name "*.js" | head -10

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # Security scanning job
  security:
    runs-on: ubuntu-latest
    name: Security Checks
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: npm audit --json > audit.json 2>&1 || true
        continue-on-error: true

      - name: Archive audit report
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit.json
          retention-days: 30

  # Lighthouse performance budgets (mobile)
