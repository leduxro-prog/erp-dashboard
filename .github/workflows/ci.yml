  #       with:
  #         name: lighthouseci-reports
  #         path: frontend/.lighthouseci/
  #         retention-days: 14

  # Docker build job (on main and develop branches)
  docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: [lint, test, build, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cypher-erp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image for vulnerabilities
        run: |
          docker build -t cypher-erp:test .
          # Using grype for vulnerability scanning (if available)
          if command -v grype &> /dev/null; then
            grype cypher-erp:test --fail-on medium || true
          fi
        continue-on-error: true

  # Job status notification
  status:
    runs-on: ubuntu-latest
    name: CI Pipeline Status
    needs: [lint, test, build, security, docker]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "CI Pipeline failed"
            exit 1
          fi
          echo "CI Pipeline completed successfully"
