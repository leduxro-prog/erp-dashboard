# ==============================================================================
# PRIMARY Deploy Pipeline - Hetzner VPS
# ==============================================================================
# This is the single source of truth for production deployments.
# Deploys to Hetzner CAX21 via SSH key-based authentication.
#
# Required GitHub Secrets:
#   HETZNER_HOST       - Server IP or hostname
#   HETZNER_USER       - SSH user (e.g. root)
#   HETZNER_SSH_KEY    - Private SSH key (ed25519)
#   HETZNER_TARGET_DIR - Remote project path (e.g. /opt/cypher-erp)
#   APP_BASE_URL       - Base URL for smoke checks (e.g. http://65.108.255.104)
#   B2B_BASE_URL       - Optional B2B base URL for smoke checks
# ==============================================================================

name: Deploy to Hetzner

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_build_checks:
        description: 'Skip build checks (emergency deploy)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      skip_build_checks:
        description: 'Skip build checks (release-gate path)'
        required: false
        type: boolean
        default: true
    secrets:
      HETZNER_HOST:
        required: true
      HETZNER_USER:
        required: true
      HETZNER_SSH_KEY:
        required: true
      HETZNER_TARGET_DIR:
        required: true
      APP_BASE_URL:
        required: true
      B2B_BASE_URL:
        required: false

env:
  NODE_VERSION: '20.x'

jobs:
  # ============================================================================
  # Pre-deploy: build checks
  # ============================================================================
  build_checks:
    runs-on: ubuntu-latest
    name: Build Checks
    if: ${{ !(inputs.skip_build_checks || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build_checks == 'true')) }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cypher_erp_test
          POSTGRES_USER: cypher_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run VAT literal guard
        run: node scripts/check-vat-literals.cjs

      - name: Run release gate checks (ci:green)
        run: npm run ci:green
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cypher_erp_test
          DB_USER: cypher_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ============================================================================
  # Deploy to Hetzner via SSH
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Hetzner
    needs: [build_checks]
    if: always() && (needs.build_checks.result == 'success' || needs.build_checks.result == 'skipped')
    outputs:
      deploy_enabled: ${{ steps.deploy-preflight.outputs.deploy_enabled }}
    environment:
      name: production
      url: ${{ vars.APP_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: deploy-preflight
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "${HETZNER_HOST:-}" ] || [ -z "${HETZNER_USER:-}" ] || [ -z "${HETZNER_SSH_KEY:-}" ] || [ -z "${HETZNER_TARGET_DIR:-}" ] || [ -z "${APP_BASE_URL:-}" ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hetzner deploy skipped because required deployment secrets are not configured."
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH connection
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "echo 'SSH connection verified'"

      - name: Create pre-deploy backup
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "systemctl start cypher-k8s-backup.service"

      - name: Sync application files
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/hetzner_deploy -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'coverage' \
            --exclude '.env' \
            --exclude 'logs' \
            --exclude 'deployment/hetzner_key' \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_TARGET_DIR }}

      - name: Capture current deployment revisions
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "kubectl -n cypher get deploy cypher-app cypher-frontend -o wide"

      - name: Build images and roll out Kubernetes
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "set -euo pipefail && \
             APP_TAR=/tmp/cypher-erp-app.tar && \
             FRONTEND_TAR=/tmp/cypher-erp-frontend.tar && \
             trap 'rm -f \"$APP_TAR\" \"$FRONTEND_TAR\"' EXIT && \
             cd ${{ secrets.HETZNER_TARGET_DIR }} && \
             docker build --no-cache -t cypher-erp-app:latest . && \
             docker build --no-cache -t cypher-erp-frontend:latest ./frontend && \
             docker save cypher-erp-app:latest -o \"$APP_TAR\" && \
             docker save cypher-erp-frontend:latest -o \"$FRONTEND_TAR\" && \
             k3s ctr images import \"$APP_TAR\" && \
             k3s ctr images import \"$FRONTEND_TAR\" && \
             kubectl kustomize orchestration/k8s/overlays/staging >/tmp/cypher-kustomize-rendered.yaml && \
             kubectl apply -k orchestration/k8s/overlays/staging && \
             kubectl -n cypher rollout restart deployment/cypher-app deployment/cypher-frontend && \
             kubectl -n cypher rollout status deployment/cypher-app --timeout=240s && \
             kubectl -n cypher rollout status deployment/cypher-frontend --timeout=240s && \
             bash orchestration/k8s/install-host-services.sh && \
             systemctl start cypher-launch-readiness.service"

      - name: Wait for services to stabilize
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: sleep 30

      - name: Cleanup SSH key
        if: always() && steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: rm -f ~/.ssh/hetzner_deploy

  # ============================================================================
  # Post-deploy smoke tests
  # ============================================================================
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests
    needs: [deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deploy_enabled == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke checks
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          B2B_BASE_URL: ${{ secrets.B2B_BASE_URL || secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          bash scripts/test/smoke-hetzner.sh "$BASE_URL"

      - name: Setup SSH key (VAT guard)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run open-doc VAT guard (21%)
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "set -euo pipefail && \
             cd ${{ secrets.HETZNER_TARGET_DIR }} && \
             bash scripts/recalculate-open-docs-vat-21.sh --dry-run --guard --k8s"

      - name: Cleanup SSH key (VAT guard)
        if: always()
        run: rm -f ~/.ssh/hetzner_deploy

  # ============================================================================
  # Rollback on failure
  # ============================================================================
  rollback:
    runs-on: ubuntu-latest
    name: Rollback on Failure
    needs: [smoke-tests]
    if: failure()

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy

      - name: Rollback containers
        run: |
          echo "::warning::Smoke tests failed - rolling back to previous containers"
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'kubectl -n cypher rollout undo deployment/cypher-app && \
             kubectl -n cypher rollout undo deployment/cypher-frontend && \
             kubectl -n cypher rollout status deployment/cypher-app --timeout=240s && \
             kubectl -n cypher rollout status deployment/cypher-frontend --timeout=240s && \
             systemctl start cypher-launch-readiness.service' \
          || echo "::error::Rollback failed - manual intervention required"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/hetzner_deploy
