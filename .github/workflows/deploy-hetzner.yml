# ==============================================================================
# PRIMARY Deploy Pipeline - Hetzner VPS
# ==============================================================================
# This is the single source of truth for production deployments.
# Deploys to Hetzner CAX21 via SSH key-based authentication.
#
# Required GitHub Secrets:
#   HETZNER_HOST       - Server IP or hostname
#   HETZNER_USER       - SSH user (e.g. root)
#   HETZNER_SSH_KEY    - Private SSH key (ed25519)
#   HETZNER_TARGET_DIR - Remote project path (e.g. /opt/cypher-erp)
#   APP_BASE_URL       - Base URL for smoke checks (e.g. http://65.108.255.104)
#   B2B_BASE_URL       - Optional B2B base URL for smoke checks
# ==============================================================================

name: Deploy to Hetzner

concurrency:
  group: deploy-hetzner-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_build_checks:
        description: 'Skip build checks (emergency deploy)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      skip_build_checks:
        description: 'Skip build checks (release-gate path)'
        required: false
        type: boolean
        default: true
    secrets:
      HETZNER_HOST:
        required: true
      HETZNER_USER:
        required: true
      HETZNER_SSH_KEY:
        required: true
      HETZNER_TARGET_DIR:
        required: true
      APP_BASE_URL:
        required: true
      B2B_BASE_URL:
        required: false

env:
  NODE_VERSION: '20.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # Pre-deploy: build checks
  # ============================================================================
  build_checks:
    runs-on: ubuntu-latest
    name: Build Checks
    if: ${{ !(inputs.skip_build_checks || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build_checks == 'true')) }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cypher_erp_test
          POSTGRES_USER: cypher_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run VAT literal guard
        run: node scripts/check-vat-literals.cjs

      - name: Run release gate checks (ci:green)
        run: npm run ci:green
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cypher_erp_test
          DB_USER: cypher_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ============================================================================
  # Deploy to Hetzner via SSH
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Hetzner
    needs: [build_checks]
    if: always() && (needs.build_checks.result == 'success' || needs.build_checks.result == 'skipped')
    outputs:
      deploy_enabled: ${{ steps.deploy-preflight.outputs.deploy_enabled }}
    environment:
      name: production
      url: ${{ vars.APP_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: deploy-preflight
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "${HETZNER_HOST:-}" ] || [ -z "${HETZNER_USER:-}" ] || [ -z "${HETZNER_SSH_KEY:-}" ] || [ -z "${HETZNER_TARGET_DIR:-}" ] || [ -z "${APP_BASE_URL:-}" ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hetzner deploy skipped because required deployment secrets are not configured."
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH connection
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "echo 'SSH connection verified'"

      - name: Create pre-deploy backup
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.HETZNER_TARGET_DIR }}"
          while IFS= read -r line; do
            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              export "$key=$value"
            fi
          done < .env
          mapfile -t app_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          runtime_env_container="${app_containers[0]:-}"
          if [ -n "$runtime_env_container" ]; then
            while IFS= read -r line; do
              key="${line%%=*}"
              value="${line#*=}"
              if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                export "$key=$value"
              fi
            done < <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$runtime_env_container")
          fi
          COMPOSE=(docker compose --env-file .env)

          BACKUP_DIR="backups/github-actions/$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$BACKUP_DIR"

          "${COMPOSE[@]}" ps > "$BACKUP_DIR/docker-compose-ps.txt" \
            || echo "Could not capture Compose status before deploy." > "$BACKUP_DIR/docker-compose-ps.txt"

          mapfile -t app_rollback_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          mapfile -t frontend_rollback_containers < <(docker ps --filter label=com.docker.compose.service=frontend --filter status=running -q)
          app_container="${app_rollback_containers[0]:-}"
          frontend_container="${frontend_rollback_containers[0]:-}"
          if [ -n "$app_container" ]; then
            docker commit "$app_container" cypher-erp-app:gha-predeploy >/dev/null \
              || echo "::warning::Could not capture app image for rollback; DB and runtime file backups will still be enforced."
          fi
          if [ -n "$frontend_container" ]; then
            docker commit "$frontend_container" cypher-erp-frontend:gha-predeploy >/dev/null \
              || echo "::warning::Could not capture frontend image for rollback; DB and runtime file backups will still be enforced."
          fi

          mapfile -t db_containers < <(docker ps --filter label=com.docker.compose.service=db --filter status=running -q)
          db_container="${db_containers[0]:-}"
          if [ -n "$db_container" ]; then
            docker exec "$db_container" pg_dump -Fc -U cypher_user -d cypher_erp > "$BACKUP_DIR/cypher_erp.dump"
          else
            if [ -z "$runtime_env_container" ]; then
              echo "::error::No running Compose db container or app runtime container found for pre-deploy backup."
              exit 1
            fi
            docker run --rm --network "container:$runtime_env_container" \
              -e PGPASSWORD="${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
              postgres:15-alpine pg_dump -Fc \
              -h "${DB_HOST:-db}" \
              -p "${DB_PORT:-5432}" \
              -U "${DB_USER:-${DB_USERNAME:-cypher_user}}" \
              -d "${DB_NAME:-cypher_erp}" > "$BACKUP_DIR/cypher_erp.dump"
          fi
          tar -czf "$BACKUP_DIR/runtime-files.tgz" --ignore-failed-read .env config uploads docker-compose.yml docker-compose.prod.yml

          echo "Pre-deploy backup completed: $BACKUP_DIR"
          REMOTE

      - name: Sync application files
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/hetzner_deploy -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude 'coverage' \
            --exclude '/.env' \
            --exclude '/logs' \
            --exclude '/backups' \
            --exclude '/config' \
            --exclude '/uploads' \
            --exclude 'deployment/hetzner_key' \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_TARGET_DIR }}

      - name: Capture current Compose status
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.HETZNER_TARGET_DIR }}"
          while IFS= read -r line; do
            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              export "$key=$value"
            fi
          done < .env
          mapfile -t app_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          runtime_env_container="${app_containers[0]:-}"
          if [ -n "$runtime_env_container" ]; then
            while IFS= read -r line; do
              key="${line%%=*}"
              value="${line#*=}"
              if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                export "$key=$value"
              fi
            done < <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$runtime_env_container")
          fi
          COMPOSE=(docker compose --env-file .env)
          "${COMPOSE[@]}" ps app frontend
          REMOTE

      - name: Build images and roll out Docker Compose
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.HETZNER_TARGET_DIR }}"
          while IFS= read -r line; do
            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              export "$key=$value"
            fi
          done < .env
          mapfile -t app_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          runtime_env_container="${app_containers[0]:-}"
          if [ -n "$runtime_env_container" ]; then
            while IFS= read -r line; do
              key="${line%%=*}"
              value="${line#*=}"
              if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                export "$key=$value"
              fi
            done < <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$runtime_env_container")
          fi
          COMPOSE=(docker compose --env-file .env)
          "${COMPOSE[@]}" build app frontend
          "${COMPOSE[@]}" up -d app frontend
          "${COMPOSE[@]}" ps app frontend
          REMOTE

      - name: Wait for services to stabilize
        if: steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: sleep 30

      - name: Cleanup SSH key
        if: always() && steps.deploy-preflight.outputs.deploy_enabled == 'true'
        run: rm -f ~/.ssh/hetzner_deploy

  # ============================================================================
  # Post-deploy smoke tests
  # ============================================================================
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests
    needs: [deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deploy_enabled == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run smoke checks
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          B2B_BASE_URL: ${{ secrets.B2B_BASE_URL || secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          bash scripts/test/smoke-hetzner.sh "$BASE_URL"

      - name: Setup SSH key (VAT guard)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run open-doc VAT guard (21%)
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.HETZNER_TARGET_DIR }}"
          while IFS= read -r line; do
            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              export "$key=$value"
            fi
          done < .env
          mapfile -t app_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          runtime_env_container="${app_containers[0]:-}"
          if [ -n "$runtime_env_container" ]; then
            while IFS= read -r line; do
              key="${line%%=*}"
              value="${line#*=}"
              if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                export "$key=$value"
              fi
            done < <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$runtime_env_container")
          fi

          mapfile -t db_containers < <(docker ps --filter label=com.docker.compose.service=db --filter status=running -q)
          db_container="${db_containers[0]:-}"
          if [ -n "$db_container" ]; then
            raw_report="$(docker exec -i "$db_container" psql -X -qAt -F '|' -v ON_ERROR_STOP=1 -U cypher_user -d cypher_erp -f - < scripts/report-open-docs-vat-21.sql)"
          else
            if [ -z "$runtime_env_container" ]; then
              echo "[ERROR] No running Compose db container or app runtime container found for VAT guard."
              exit 1
            fi
            raw_report="$(docker run --rm -i --network "container:$runtime_env_container" \
              -e PGPASSWORD="${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
              postgres:15-alpine psql -X -qAt -F '|' -v ON_ERROR_STOP=1 \
              -h "${DB_HOST:-db}" \
              -p "${DB_PORT:-5432}" \
              -U "${DB_USER:-${DB_USERNAME:-cypher_user}}" \
              -d "${DB_NAME:-cypher_erp}" \
              -f - < scripts/report-open-docs-vat-21.sql)"
          fi
          echo "target|status_scope|mismatches|sample_ids"
          printf '%s\n' "$raw_report"

          total="0"
          while IFS='|' read -r target _status_scope mismatches _sample_ids; do
            if [ "$target" = "__TOTAL__" ]; then
              total="${mismatches:-0}"
            fi
          done <<< "$raw_report"

          if [ "${total:-0}" -gt 0 ]; then
            echo "[ERROR] VAT guard failed: found $total open-doc VAT mismatch(es)."
            exit 1
          fi

          echo "[OK] VAT open-doc check finished."
          REMOTE

      - name: Cleanup SSH key (VAT guard)
        if: always()
        run: rm -f ~/.ssh/hetzner_deploy

  # ============================================================================
  # Rollback on failure
  # ============================================================================
  rollback:
    runs-on: ubuntu-latest
    name: Rollback on Failure
    needs: [smoke-tests]
    if: failure()

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy

      - name: Rollback containers
        run: |
          echo "::warning::Smoke tests failed - restoring pre-deploy Compose images"
          if ! ssh -i ~/.ssh/hetzner_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.HETZNER_TARGET_DIR }}"
          while IFS= read -r line; do
            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              export "$key=$value"
            fi
          done < .env
          mapfile -t app_containers < <(docker ps --filter label=com.docker.compose.service=app --filter status=running -q)
          runtime_env_container="${app_containers[0]:-}"
          if [ -n "$runtime_env_container" ]; then
            while IFS= read -r line; do
              key="${line%%=*}"
              value="${line#*=}"
              if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                export "$key=$value"
              fi
            done < <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$runtime_env_container")
          fi
          COMPOSE=(docker compose --env-file .env)
          docker image inspect cypher-erp-app:gha-predeploy >/dev/null
          docker image inspect cypher-erp-frontend:gha-predeploy >/dev/null
          docker image tag cypher-erp-app:gha-predeploy cypher-erp-app:latest
          docker image tag cypher-erp-frontend:gha-predeploy cypher-erp-frontend:latest
          "${COMPOSE[@]}" up -d app frontend
          "${COMPOSE[@]}" ps app frontend
          REMOTE
          then
            echo "::error::Rollback failed - manual intervention required"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/hetzner_deploy
